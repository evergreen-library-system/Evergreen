<eg-staff-banner bannerText="Create New MARC Record" i18n-bannerText></eg-staff-banner>

<div class="row">
  <div class="hstack form-inline gap-2">
    <label for="select-marc-template" class="control-label" i18n>Select MARC template</label>
    <select id="select-marc-template" class="form-select w-auto" [(ngModel)]="template_name">
      <option value="" i18n>No Template Selected</option>
      @for (template of template_list; track trackByTemplateName) {
        <option
          [selected]="template_name === template" [value]="template">{{template}}
        </option>
      }

    </select>
    <button type="button" class="btn btn-primary" (click)="loadTemplate()" [disabled]="!template_name" i18n>Load</button>
    <button type="button" class="btn btn-normal" (click)="setDefaultTemplate()" [disabled]="template_name === default_template_name" i18n>Set Workstation Default</button>
  </div>
</div>
@if (have_template) {
  <div class="row col-md-12 mt-3">
    <eg-marc-editor
      [recordXml]="marc_template"
      [recordId]="new_bib_id"
      [recordSource]="recordSource"
      (recordSaved)="onRecordSaved($event)"
      (recordSourceChanged)="onRecordSourceChanged($event)"
    >
      <!-- This is how we affect the state of the marc-editor's fast add now -->
      <eg-fast-add-selector #fastAdd [checkedOnInit]="fastAddChecked" [saveShowFieldChanges]="true"></eg-fast-add-selector>
    </eg-marc-editor>
  </div>
}
