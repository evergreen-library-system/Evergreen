<form [formGroup]="form" class="d-inline-flex align-items-center h-100">
    <div class="d-inline-flex align-items-center h-100">
        <input class="form-check-input mt-0" type="checkbox" id="fast-add-item" formControlName="fastAddItem" />
        <label class="form-label mb-0 ms-1 form-check-label" for="fast-add-item">
            Add Item
        </label>
    </div>

    @if(showFields) {
        <div class="d-inline-flex">
            <input type="text" class="form-control ms-2" placeholder="Call Number" i18n-placeholder aria-label="Call Number" i18n-aria-label formControlName="callNumber" />
            <input type="text" class="form-control ms-2" placeholder="Barcode" i18n-placeholder aria-label="Barcode" i18n-aria-label formControlName="barcode" />
        </div>
    }
</form>
