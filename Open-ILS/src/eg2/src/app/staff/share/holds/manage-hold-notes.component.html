<ng-template #dialogContent>
  <div class="modal-header">
    <h4 class="modal-title" i18n>Manage hold notes for hold {{ holdId() }}</h4>
    <button type="button" class="btn-close btn-close-white"
    i18n-aria-label aria-label="Close dialog" (click)="close()"></button>
  </div>
  <div class="modal-body">
    @if (showCreateForm()) {
      <form [formGroup]="newNoteForm">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="new-hold-note-pub"  formControlName="pub">
          <label class="form-check-label" for="new-hold-note-pub" i18n>Patron visible?</label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="new-hold-note-slip" formControlName="slip"/>
          <label class="form-check-label" for="new-hold-note-slip" i18n>Print on slip?</label>
        </div>

        <label for="new-hold-note-title" class="form-label" i18n>Title</label>
        <input type="text" class="form-control" id="new-hold-note-title" formControlName="title"/>

        <label for="new-hold-note-body" class="form-label" i18n>Body</label>
        <textarea class="form-control" id="new-hold-note-body" formControlName="body" rows="3"></textarea>

        <button class="btn btn-secondary my-3" i18n type="submit" (click)="create()">Add note</button>
        <button class="btn btn-outline-dark" i18n type="button" (click)="showCreateForm.set(false)" i18n>Cancel</button>
      </form>
    } @else {
      <button i18n type="button" class="btn btn-secondary my-3" (click)="showCreateForm.set(true)">Add note</button>
    }
    @if (notes.hasValue()) {
      <ul class="list-group">
        @for (note of notes.value(); track note.id()) {
          <li class="list-group-item d-flex justify-content-between align-items-start">
            <div class="ms-2 me-auto">
              <div class="fw-bold">{{ note.title() }}</div>
              {{ note.body() }}
            </div>
            <button class="btn btn-destroy" i18n type="button" (click)="delete(note)">Remove</button>
          </li>
        }
      </ul>
    }
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-success"
    (click)="close(true)" i18n>Close</button>
  </div>
</ng-template>
