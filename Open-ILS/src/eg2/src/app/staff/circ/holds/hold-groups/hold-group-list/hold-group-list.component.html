<eg-grid 
#grid
[dataSource]="holdGroupsDataSource"
idlClass="cub"
persistKey="cat.bucket.batch_hold.list"
autoGeneratedColumnOrder="name,description,owning_lib,pub,num_users"
showFields="name,description,owning_lib,pub,num_users"
[sortable]="true"
[filterable]="true"
(onRowActivate)="selectHoldGroup($event)"
>
    <eg-grid-toolbar-button label="New Hold Group" label-i18n standalone="true" (onClick)="createHoldGroup()"></eg-grid-toolbar-button>
    <eg-grid-toolbar-button label="Edit Hold Group" label-i18n standalone="true" [disabled]="has_none_selected()" (onClick)="editHoldGroup()"></eg-grid-toolbar-button>

    <eg-grid-toolbar-action 
        label="Edit Hold Group" label-i18n
        [disabled]="has_none_selected()"
        (onClick)="editHoldGroup()"
    />

    <eg-grid-toolbar-action 
        label="Delete Hold Group" label-i18n
        [disabled]="has_none_selected()"
        (onClick)="deleteHoldGroup()"
    />

    <eg-grid-toolbar-action 
        label="Manage Users" label-i18n
        [disabled]="has_none_selected()"
        (onClick)="selectCurrentHoldGroup()"
    />

    <eg-grid-toolbar-action 
        label="Manage Hold Group Events" label-i18n
        [disabled]="has_none_selected()"
        (onClick)="showHoldGroupEvents()"
    />

    <eg-grid-column i18n-label label="User Count" 
        path="num_users"
        datatype="int"
        [sortable]="false"
        [filterable]="false">
    </eg-grid-column>
</eg-grid>

<eg-fm-record-editor
    #editDialog
    [idlClass]="'cub'"
    [fieldOrder]="'name,description,owning_lib, pub'"
    [defaultNewRecord]="defaultUserBucket"
    [preloadLinkedValues]="true"
    [hiddenFieldsList]="['create_time', 'owner', 'btype', 'items', 'id']"
    [requiredFields]="'name,owning_lib,pub'"
    >

</eg-fm-record-editor>

<eg-confirm-dialog
    #deleteDialog
    alertType="danger"
    dialogTitle="Confirm Hold Group Deletion" dialogTitle-i18n
    confirmString="Delete" confirmString-i18n
    dialogBody="Delete {{bucketToDeleteName}}?" i18n-dialogBody
>
</eg-confirm-dialog>
