<eg-patron-search-dialog #patronSearch />
<eg-alert-dialog #duplicatePatronAlert 
    i18n-dialogTitle dialogTitle="Duplicate Patrons"
    [dialogBodyTemplate]="duplicatePatronContent"
/>
<eg-confirm-dialog #selectHoldGroup
    dialogTitle="Select Hold Group" i18n-dialogTitle
>
    <div class="row justify-content-center">
        <eg-combobox placeholder="Select a Hold Group..." placeholder-i18n 
            idlClass="cub"
            [(ngModel)]="patronTransferSelectedBucket"
            [idlBaseQuery]="patronTransferIdlBaseQuery()"
            [allowFreeText]="false"
            [asyncSupportsEmptyTermClick]="true"
            required="true"
        ></eg-combobox>
    </div>
</eg-confirm-dialog>

<ng-template #duplicatePatronContent>
    <div class="alert alert-danger">
        <div i18n>Failed to add users to a hold group. These users are already in the hold group:</div>
        @for (patron of duplicatePatrons; track patron.id()){
            <div><a target="_blank" href="/eg2/staff/circ/patron/{{patron.id()}}/alerts">{{patron.card().barcode()}}</a></div>
        }
    </div>
</ng-template>


<eg-hold-group-info></eg-hold-group-info>

<form #addUserForm="ngForm">
    <div #addUserButtons class="d-flex justify-content-between">
        <div class="input-group has-validation w-50">
            <span class="input-group-text" id="scan-label">Scan Barcode</span>
            <input #barcodeInput type="text" class="form-control" 
                placeholder="Barcode..." i18n-placeholder
                [(ngModel)]="barcodeValue" name="barcode"
                aria-describedby="barcode-feedback"
                [class.is-invalid]="barcodeError"
                (keyup.enter)="addUserByBarcode().subscribe()"
            />
        </div>
        <button type="button" class="btn btn-primary" (click)="addFromSearchDialog()">
            <span class="material-icons mat-icon-in-button align-middle" aria-hidden="true">search</span>
            <span class="align-middle" i18n>Add from Patron Search</span>
        </button>
    </div>
    @if (barcodeError) {
        <div id="barcode-feedback" class="invalid-feedback">
            {{barcodeError}}
        </div>
    }
</form>

<eg-grid
    #grid
    [dataSource]="dataSource"
    [cellTextGenerator]="cellTextGenerator"
    idlClass="au"
    persistKey="cat.bucket.batch_hold.view"
    showFields="family_name,first_given_name,home_ou,profile,card"
    autogeneratedColumnOrder="family_name,first_given_name,home_ou,profile,card"
    [sortable]="true"
    [useLocalSort]="true"
    [filterable]="true"
>
    <eg-grid-toolbar-action
        label="Remove Selected Users" label-i18n
        [disabled]="hasNoSelectedUsers()"
        (onClick)="removeSelectedUsers().subscribe()"
    ></eg-grid-toolbar-action>
    <eg-grid-toolbar-action
        label="Move Selected Users to another Hold Group" label-i18n
        [disabled]="hasNoSelectedUsers()"
        (onClick)="copySelectedUsers(true).subscribe()"
    ></eg-grid-toolbar-action>
    <eg-grid-toolbar-action
        label="Copy Selected Users to another Hold Group" label-i18n
        [disabled]="hasNoSelectedUsers()"
        (onClick)="copySelectedUsers().subscribe()"
    ></eg-grid-toolbar-action>

    <eg-grid-column
        i18n-label label="Barcode"
        path="card"
        [cellTemplate]="barcodeTemplate"
    />
</eg-grid>

<ng-template #barcodeTemplate let-r="row">
    @if (r?.card) {
        <a routerLink="/staff/circ/patron/{{r?.id()}}/checkout">
            {{r?.card?.()?.barcode()}}
        </a>
    }
</ng-template>
